# Generated by synth from Employee Management (Spring Boot)
spring.application.name=app

# Default to in-memory H2 so the app boots out of the box.
# Integration tests override these via Testcontainers.
spring.datasource.url=jdbc:h2:mem:synth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway — migrations in src/main/resources/db/migration/
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Request tracing — include X-Request-ID correlation ID in every log line
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlationId:--}] %logger{36} - %msg%n

# Pagination limits — max 100 rows per page
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
